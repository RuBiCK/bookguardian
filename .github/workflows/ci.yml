name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag comments are for
# humans); Dependabot/Renovate can bump them, a tag rewrite cannot.

jobs:
  supply-chain:
    name: Supply chain · lockfile release age
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Every locked package must be at least 7 days old
        run: node scripts/check-release-age.mjs --days 7

  checks:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Version is read from the "packageManager" field in package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile, minimumReleaseAge enforced by pnpm)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests with coverage thresholds (SQLite)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
            packages/shared/coverage/lcov.info
          retention-days: 7

  docker:
    name: Docker · build image + smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (multi-stage, release-age rule enforced by pnpm)
        run: docker build --tag bookguardian:ci .

      - name: Boot the container and check health + SPA + API envelope
        run: |
          set -euxo pipefail
          docker run --detach --name bookguardian --publish 3000:3000 bookguardian:ci
          for i in $(seq 1 30); do
            if curl --fail --silent 'http://localhost:3000/api/health?shallow=true'; then break; fi
            sleep 1
            if [ "$i" = 30 ]; then docker logs bookguardian; exit 1; fi
          done
          curl --fail --silent http://localhost:3000/api/health | grep -q '"reachable":true'
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost:3000/books/deep-link | grep -q '<div id="root">'
          curl --silent http://localhost:3000/api/nope | grep -q '"code":"not_found"'
          docker exec bookguardian test -f /data/bookguardian.db
          docker exec bookguardian id -u | grep -qx 1000
          docker logs bookguardian

      - name: Stop the container
        if: always()
        run: docker rm --force bookguardian

  e2e:
    name: E2E · iPhone 14 viewport (web + API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @bookguardian/web exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
